<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Шпаргалка — Тез іздеу</title>
<style>
  :root{
    --bg:#0a0e27; --card:#0f172a; --muted:#94a3b8; --text:#e5e7eb;
    --ok:#22c55e; --accent:#38bdf8; --warn:#f59e0b;
    --line:#1e293b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding:10px}
  .wrap{max-width:100%;margin:0 auto}
  
  .header{background:linear-gradient(135deg,#0f172a,#1e1b4b);padding:16px;border-radius:16px;margin-bottom:14px;border:1px solid var(--line)}
  h1{margin:0 0 10px 0;font-size:20px}
  
  .search-box{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  input[type="search"]{flex:1;min-width:200px;padding:14px;border:2px solid var(--accent);border-radius:12px;background:#0b1220;color:var(--text);font-size:16px}
  input[type="search"]:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.3)}
  
  .quick-tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{padding:8px 12px;background:#1e293b;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:13px;transition:.2s}
  .tag:hover{background:var(--accent);border-color:var(--accent);color:#000}
  .tag.active{background:var(--accent);color:#000;border-color:var(--accent)}
  
  .stats{display:flex;gap:10px;padding:10px;background:#0b1220;border-radius:12px;border:1px solid var(--line);font-size:13px;flex-wrap:wrap}
  .stat-item{padding:4px 8px;background:rgba(56,189,248,.1);border-radius:6px}
  
  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;transition:.2s}
  .card:hover{border-color:var(--accent);box-shadow:0 8px 16px rgba(56,189,248,.15)}
  .card.hidden{display:none}
  
  .q-title{font-size:16px;font-weight:700;margin-bottom:8px;color:#e5e7eb;line-height:1.3}
  .opts{font-size:13px;color:var(--muted);margin-bottom:6px}
  .opt{display:inline-block;padding:3px 6px;background:#0b1220;border-radius:6px;margin:2px;border:1px solid var(--line)}
  
  .answer{padding:10px;background:rgba(34,197,94,.15);border-left:3px solid var(--ok);border-radius:8px;margin-top:8px;font-weight:600;color:#22c55e}
  
  .no-results{text-align:center;padding:40px 20px;color:var(--muted)}
  
  .category-badge{display:inline-block;padding:3px 8px;background:rgba(59,130,246,.2);border-radius:6px;font-size:11px;color:#60a5fa;margin-bottom:8px}
  
  @media(max-width:600px){
    .results{grid-template-columns:1fr}
    input[type="search"]{font-size:16px}
    h1{font-size:18px}
  }
  
  .highlight{background:rgba(251,146,60,.3);color:#fb923c}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>📖 Шпаргалка — Барлық сұрақ-жауап</h1>
    <p class="muted" style="margin:0;font-size:13px">💡 Кілт сөз немесе сұрақ жазып, <b>Enter</b> басыңыз</p>
  </div>

  <div class="search-box">
    <input type="search" id="search" placeholder="alert, border, PHP, JavaScript, CSS, HTML, SQL..." autofocus>
    <button onclick="clearSearch()" style="padding:12px 16px;background:#991b1b;border:1px solid #dc2626;border-radius:12px;cursor:pointer;color:#fff">🗑 Тазалау</button>
  </div>

  <div class="quick-tags" id="tags"></div>

  <div class="stats">
    <div class="stat-item">Барлығы: <b id="totalStat">0</b></div>
    <div class="stat-item">Табылды: <b id="foundStat">0</b></div>
    <div class="stat-item">Аралас.: <b id="filterStat">0</b></div>
  </div>

  <div class="results" id="results"></div>
  <div class="no-results" id="noResults">Сұрақ табылмады 🤷</div>
</div>

<script>
let questions = [];
const categoryColors = {
  "JavaScript":"#38bdf8",
  "CSS":"#f59e0b",
  "HTML":"#ec4899",
  "PHP":"#a855f7",
  "SQL":"#22c55e"
};

function parseData(){
  const raw = document.getElementById("DATA").textContent.trim();
  questions = raw.split(/\n+/).map((line, idx)=>{
    const p = line.split("\t");
    if(p.length < 8) return null;
    return {
      id: idx,
      q: p[0].trim(),
      opts: {A:p[1].trim(), B:p[2].trim(), C:p[3].trim(), D:p[4].trim(), E:p[5].trim()},
      ans: p[6].trim().toUpperCase(),
      category: p[7].trim() || "Басқа"
    };
  }).filter(Boolean);

  document.getElementById("totalStat").textContent = questions.length;
  renderTags();
  renderResults();
}

function renderTags(){
  const cats = [...new Set(questions.map(q=>q.category))];
  document.getElementById("tags").innerHTML = cats.map(cat=>`
    <span class="tag" onclick="filterByTag(this, '${cat}')" title="${cat}">
      ${cat} (${questions.filter(q=>q.category===cat).length})
    </span>
  `).join("");
}

function filterByTag(elem, cat){
  document.querySelectorAll(".tag").forEach(t=>t.classList.remove("active"));
  if(elem.textContent.includes(cat)){
    elem.classList.add("active");
    filterResults(cat);
  } else {
    filterResults("");
  }
}

function search(){
  renderResults();
}

function clearSearch(){
  document.getElementById("search").value = "";
  document.querySelectorAll(".tag").forEach(t=>t.classList.remove("active"));
  renderResults();
}

function filterResults(cat){
  const val = document.getElementById("search").value.toLowerCase();
  const filter = (q) => {
    const text = (q.q + " " + Object.values(q.opts).join(" ")).toLowerCase();
    const matchTxt = !val || text.includes(val);
    const matchCat = !cat || q.category === cat;
    return matchTxt && matchCat;
  };
  
  const filtered = questions.filter(filter);
  document.getElementById("foundStat").textContent = filtered.length;
  
  renderCards(filtered);
}

function renderResults(){
  const val = document.getElementById("search").value.toLowerCase();
  const filtered = questions.filter(q => 
    !val || (q.q + " " + Object.values(q.opts).join(" ")).toLowerCase().includes(val)
  );
  document.getElementById("foundStat").textContent = filtered.length;
  renderCards(filtered);
}

function renderCards(arr){
  if(arr.length === 0){
    document.getElementById("results").innerHTML = "";
    document.getElementById("noResults").classList.remove("hidden");
    return;
  }
  document.getElementById("noResults").classList.add("hidden");
  document.getElementById("results").innerHTML = arr.map((q,i)=>{
    const color = categoryColors[q.category] || "#38bdf8";
    return `
      <div class="card">
        <div style="color:${color};font-size:11px;font-weight:700;margin-bottom:6px">
          ▪ ${q.category}
        </div>
        <div class="q-title">${q.q}</div>
        <div class="opts">
          <span class="opt">A) ${q.opts.A}</span>
          <span class="opt">B) ${q.opts.B}</span>
          <span class="opt">C) ${q.opts.C}</span>
          <span class="opt">D) ${q.opts.D}</span>
          <span class="opt">E) ${q.opts.E}</span>
        </div>
        <div class="answer">
          ✅ Жауап: <b>${q.ans})</b> ${q.opts[q.ans]}
        </div>
      </div>
    `;
  }).join("");
}

document.getElementById("search").addEventListener("keyup", search);
document.getElementById("search").addEventListener("input", search);

parseData();
</script>
